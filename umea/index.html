<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text Brush Canvas</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 1rem;
      background: #f5f7fb;
      color: #202124;
    }
    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-bottom: 0.75rem;
      align-items: center;
    }
    body, .toolbar input, .toolbar select, .toolbar button, .status {
      font-family: helvetica, sans-serif;
      font-size: 8pt;
      text-transform: lowercase;
    }
    .toolbar input, .toolbar select, .toolbar button {
      padding: 0.4rem 0.6rem;
    }
    #drawingCanvas {
      border: 1px solid #bbb;
      background: #ffffff;
      cursor: crosshair;
      width: 100%;
      max-width: 100%;
      height: 600px;
      touch-action: none;
    }
    .status {
      margin-top: 0.5rem;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <h1>Text Brush + Shape Canvas</h1>
  <p>Type text and click to stamp as brush. Choose shape mode to draw shape + label.</p>

  <div class="toolbar">
    <label>Brush text: <input id="brushText" value="Hello" placeholder="Type and use keyboard" /></label>
    <label>Mode:
      <select id="drawMode">
        <option value="text">Text Brush</option>
        <option value="rect">Rectangle</option>
        <option value="circle">Circle</option>
        <option value="line">Line</option>
        <option value="move">Move/Drag</option>
      </select>
    </label>
    <label>Stroke width: <input id="strokeWidth" type="number" value="2" min="0" style="width: 5rem" /></label>
    <button id="clearBtn">Clear</button>
    <button id="undoBtn">Undo</button>
    <button id="exportSvgBtn">Export SVG</button>
    <button id="exportPngBtn">Export PNG</button>
  </div>

  <svg id="drawingCanvas" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMinYMin meet" viewBox="0 0 1200 800"></svg>
  <div class="status" id="status">Current brush: "Hello"</div>

  <script>
    const svg = document.getElementById('drawingCanvas');
    const brushText = document.getElementById('brushText');
    const mode = document.getElementById('drawMode');
    const strokeWidth = document.getElementById('strokeWidth');
    const status = document.getElementById('status');
    const clearBtn = document.getElementById('clearBtn');
    const undoBtn = document.getElementById('undoBtn');
    const exportSvgBtn = document.getElementById('exportSvgBtn');
    const exportPngBtn = document.getElementById('exportPngBtn');

    let drawing = false;
    let startX = 0;
    let startY = 0;
    let tempShape = null;
    let moving = false;
    let selectedShape = null;
    let initialShapeCoords = null;
    const history = [];

    function getSvgPoint(evt) {
      const pt = svg.createSVGPoint();
      pt.x = evt.clientX;
      pt.y = evt.clientY;
      return pt.matrixTransform(svg.getScreenCTM().inverse());
    }

    function updateStatus() {
      status.textContent = `Mode: ${mode.value} • Brush: "${brushText.value}" • Color: black`;
    }

    function addShape(element) {
      svg.appendChild(element);
      history.push(element);
    }

    svg.addEventListener('mousedown', (e) => {
      const pt = getSvgPoint(e);
      if (mode.value === 'move') {
        if (e.target === svg) return;
        selectedShape = e.target;
        moving = true;
        startX = pt.x;
        startY = pt.y;

        const tag = selectedShape.tagName.toLowerCase();
        if (tag === 'rect') {
          initialShapeCoords = {
            x: parseFloat(selectedShape.getAttribute('x') || 0),
            y: parseFloat(selectedShape.getAttribute('y') || 0)
          };
        } else if (tag === 'circle') {
          initialShapeCoords = {
            cx: parseFloat(selectedShape.getAttribute('cx') || 0),
            cy: parseFloat(selectedShape.getAttribute('cy') || 0)
          };
        } else if (tag === 'line') {
          initialShapeCoords = {
            x1: parseFloat(selectedShape.getAttribute('x1') || 0),
            y1: parseFloat(selectedShape.getAttribute('y1') || 0),
            x2: parseFloat(selectedShape.getAttribute('x2') || 0),
            y2: parseFloat(selectedShape.getAttribute('y2') || 0)
          };
        } else if (tag === 'text') {
          initialShapeCoords = {
            x: parseFloat(selectedShape.getAttribute('x') || 0),
            y: parseFloat(selectedShape.getAttribute('y') || 0)
          };
        } else {
          initialShapeCoords = null;
        }

        return;
      }

      if (mode.value === 'text') {
        if (!brushText.value.trim()) return;
        const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
        txt.setAttribute('x', pt.x);
        txt.setAttribute('y', pt.y);
        txt.setAttribute('fill', '#000000');
        txt.setAttribute('stroke', 'none');
        txt.setAttribute('font-size', '32');
        txt.setAttribute('font-family', 'Segoe UI, Arial, sans-serif');
        txt.textContent = brushText.value;
        addShape(txt);
      } else {
        drawing = true;
        startX = pt.x;
        startY = pt.y;
        if (mode.value === 'rect') {
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', startX);
          rect.setAttribute('y', startY);
          rect.setAttribute('width', 0);
          rect.setAttribute('height', 0);
          rect.setAttribute('fill', '#000000');
          rect.setAttribute('stroke', '#000000');
          rect.setAttribute('stroke-width', strokeWidth.value);
          tempShape = rect;
          svg.appendChild(rect);
        } else if (mode.value === 'circle') {
          const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circ.setAttribute('cx', startX);
          circ.setAttribute('cy', startY);
          circ.setAttribute('r', 0);
          circ.setAttribute('fill', '#000000');
          circ.setAttribute('stroke', '#000000');
          circ.setAttribute('stroke-width', strokeWidth.value);
          tempShape = circ;
          svg.appendChild(circ);
        } else if (mode.value === 'line') {
          const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
          line.setAttribute('x1', startX);
          line.setAttribute('y1', startY);
          line.setAttribute('x2', startX);
          line.setAttribute('y2', startY);
          line.setAttribute('stroke', '#000000');
          line.setAttribute('stroke-width', strokeWidth.value);
          tempShape = line;
          svg.appendChild(line);
        }
      }
    });

    svg.addEventListener('mousemove', (e) => {
      const pt = getSvgPoint(e);
      if (moving && selectedShape && initialShapeCoords) {
        const dx = pt.x - startX;
        const dy = pt.y - startY;
        const tag = selectedShape.tagName.toLowerCase();
        if (tag === 'rect') {
          selectedShape.setAttribute('x', initialShapeCoords.x + dx);
          selectedShape.setAttribute('y', initialShapeCoords.y + dy);
        } else if (tag === 'circle') {
          selectedShape.setAttribute('cx', initialShapeCoords.cx + dx);
          selectedShape.setAttribute('cy', initialShapeCoords.cy + dy);
        } else if (tag === 'line') {
          selectedShape.setAttribute('x1', initialShapeCoords.x1 + dx);
          selectedShape.setAttribute('y1', initialShapeCoords.y1 + dy);
          selectedShape.setAttribute('x2', initialShapeCoords.x2 + dx);
          selectedShape.setAttribute('y2', initialShapeCoords.y2 + dy);
        } else if (tag === 'text') {
          selectedShape.setAttribute('x', initialShapeCoords.x + dx);
          selectedShape.setAttribute('y', initialShapeCoords.y + dy);
        }
        return;
      }
      if (!drawing || !tempShape) return;
      const dx = pt.x - startX;
      const dy = pt.y - startY;
      if (mode.value === 'rect') {
        tempShape.setAttribute('x', Math.min(startX, pt.x));
        tempShape.setAttribute('y', Math.min(startY, pt.y));
        tempShape.setAttribute('width', Math.abs(dx));
        tempShape.setAttribute('height', Math.abs(dy));
      } else if (mode.value === 'circle') {
        const r = Math.sqrt(dx * dx + dy * dy);
        tempShape.setAttribute('r', r);
      } else if (mode.value === 'line') {
        tempShape.setAttribute('x2', pt.x);
        tempShape.setAttribute('y2', pt.y);
      }
    });

    svg.addEventListener('mouseup', (e) => {
      if (moving) {
        moving = false;
        selectedShape = null;
        initialShapeCoords = null;
      }
      if (!drawing) return;
      drawing = false;
      if (tempShape) {
        history.push(tempShape);
        if (brushText.value.trim()) {
          const pt = getSvgPoint(e);
          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          label.setAttribute('x', pt.x + 5);
          label.setAttribute('y', pt.y - 5);
          label.setAttribute('fill', '#000000');
          label.setAttribute('font-size', '18');
          label.textContent = brushText.value;
          svg.appendChild(label);
          history.push(label);
        }
      }
      tempShape = null;
    });

    svg.addEventListener('mouseleave', () => {
      drawing = false;
      tempShape = null;
      moving = false;
      selectedShape = null;
      initialShapeCoords = null;
    });

    clearBtn.addEventListener('click', () => {
      while (svg.firstChild) svg.removeChild(svg.firstChild);
      history.length = 0;
    });

    undoBtn.addEventListener('click', () => {
      const last = history.pop();
      if (last) svg.removeChild(last);
    });

    exportSvgBtn.addEventListener('click', () => {
      const clone = svg.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.removeAttribute('style');
      const xml = new XMLSerializer().serializeToString(clone);
      const svgBlob = new Blob([xml], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'text-brush-canvas.svg';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });

    exportPngBtn.addEventListener('click', () => {
      const serializer = new XMLSerializer();
      const source = serializer.serializeToString(svg);
      const svgBlob = new Blob([source], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);
      const image = new Image();
      const size = { width: 1200, height: 800 };
      image.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size.width;
        canvas.height = size.height;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, size.width, size.height);
        ctx.drawImage(image, 0, 0, size.width, size.height);
        const pngUrl = canvas.toDataURL('image/png');
        const link = document.createElement('a');
        link.href = pngUrl;
        link.download = 'text-brush-canvas.png';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
      };
      image.onerror = () => {
        alert('Could not generate PNG. Try again.');
      };
      image.src = url;
    });

    brushText.addEventListener('input', updateStatus);
    mode.addEventListener('change', updateStatus);
    strokeWidth.addEventListener('input', updateStatus);

    document.addEventListener('keydown', (e) => {
      if (document.activeElement === brushText) return;
      if (e.key === 'Backspace') {
        brushText.value = brushText.value.slice(0, -1);
      } else if (e.key.length === 1) {
        brushText.value += e.key;
      } else if (e.key === 'Enter') {
        brushText.value += '\n';
      }
      updateStatus();
    });

    updateStatus();
  </script>
</body>
</html>
